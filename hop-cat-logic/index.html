<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hộp cát Logic</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#14112a;--panel:#1d1838;--line:#2e2758;--text:#d9d4ff;--muted:#8b84b8;--hi:#ffd84a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'VT323',ui-monospace,monospace;font-size:20px;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:var(--panel);border-bottom:2px solid var(--line);z-index:3}
button,select{font:inherit;color:var(--text);background:#262048;border:2px solid var(--line);padding:1px 9px;cursor:pointer;border-radius:4px}
button:hover,select:hover{border-color:#5a4fa8}
button.on{border-color:var(--hi);color:var(--hi)}
.sep{width:2px;height:26px;background:var(--line);margin:0 4px}
label{display:flex;gap:6px;align-items:center;color:var(--muted)}
#counter{position:fixed;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:2}
#counter .num{display:inline-block;font-size:54px;line-height:1;color:var(--hi);background:#0b0a18;padding:2px 16px;border:2px solid #3a3320;letter-spacing:4px;text-shadow:0 0 12px rgba(255,216,74,.6)}
#counter .lbl{font-size:30px;letter-spacing:3px;color:#fff}
#counter .sub{font-size:22px;letter-spacing:2px;color:var(--muted)}
#help{position:fixed;bottom:0;left:0;right:0;padding:5px 10px;background:var(--panel);border-top:2px solid var(--line);color:var(--muted);font-size:18px;z-index:3}
#help b{color:var(--text);font-weight:normal}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<div id="top">
  <span id="tools"></span>
  <button id="rot" title="Xoay transistor (R)">⟳ Xoay</button>
  <div class="sep"></div>
  <button id="play" title="Tạm dừng / chạy (P)">⏸ Dừng</button>
  <button id="step" title="Chạy 1 bước (.)">⏭ 1 bước</button>
  <label>Tốc độ <input id="speed" type="range" min="1" max="61" value="12"><span id="spv">12/s</span></label>
  <div class="sep"></div>
  <select id="ex"><option value="">— Mạch mẫu —</option></select>
  <button id="undo" title="Hoàn tác (Ctrl+Z)">↶</button>
  <button id="clear">Xoá hết</button>
  <button id="exp">Lưu file</button>
  <button id="imp">Mở file</button>
  <input id="file" type="file" accept=".json" hidden>
</div>
<div id="counter"><div class="num" id="cnum">0</div><div class="lbl">TRANSISTORS</div><div class="sub" id="cname"></div></div>
<canvas id="cv"></canvas>
<div id="help">
  <b>Chuột trái</b>: đặt / bấm công tắc · <b>Chuột phải</b>: xoá · <b>Lăn chuột</b>: phóng to · <b>Chuột giữa / giữ Space</b>: kéo màn hình · <b>R</b>: xoay · <b>1–9,0</b>: chọn công cụ ·
  Transistor N dẫn điện (trên↔dưới) khi cực điều khiển (trái/phải) có điện; P thì ngược lại.
</div>
<script>
// ---------- dữ liệu ----------
const TOOLS=[['wire','Dây','1'],['nmos','N','2'],['pmos','P','3'],['vcc','Nguồn +','4'],['gnd','Mát −','5'],['pull','Kéo lên','6'],['sw','Công tắc','7'],['lamp','Đèn','8'],['bridge','Cầu chéo','9'],['erase','Xoá','0'],['pan','✋','']];
const TIPS={wire:'Dây dẫn',nmos:'Transistor N: dẫn khi cổng = 1',pmos:'Transistor P: dẫn khi cổng = 0',vcc:'Nguồn mạnh (1)',gnd:'Mát (0) — thắng điện trở kéo lên',pull:'Điện trở kéo lên: 1 yếu, bị Mát kéo xuống 0',sw:'Công tắc đầu vào',lamp:'Đèn đầu ra',bridge:'Hai dây bắt chéo không chạm nhau',erase:'Xoá',pan:'Kéo màn hình'};
let tool='wire',rot=0;
const grid=new Map();
const K=(x,y)=>x+','+y;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // lên phải xuống trái
const NODE_T=new Set(['wire','vcc','gnd','pull','sw','lamp','bridge']);
const isTr=t=>t==='nmos'||t==='pmos';
let dirty=true,label='';

// ---------- mô phỏng (mức công tắc) ----------
let nodeIds=new Map(),N=0,staticP=new Int32Array(0),trans=[],nodeVal=new Uint8Array(0),nodeShort=new Uint8Array(0);
function nodeAt(x,y,d){const k=K(x,y),c=grid.get(k);if(!c||!NODE_T.has(c.t))return -1;const id=nodeIds.get(k);return c.t==='bridge'?((d===1||d===3)?id:id+1):id}
function find(p,i){while(p[i]!==i){p[i]=p[p[i]];i=p[i]}return i}
function uni(p,a,b){a=find(p,a);b=find(p,b);if(a!==b)p[a]=b}
function rebuild(){
  nodeIds=new Map();N=0;
  for(const[k,c]of grid)if(NODE_T.has(c.t)){nodeIds.set(k,N);N+=c.t==='bridge'?2:1}
  const p=new Int32Array(N);for(let i=0;i<N;i++)p[i]=i;
  trans=[];
  for(const[k,c]of grid){
    const[x,y]=k.split(',').map(Number);
    if(NODE_T.has(c.t)){
      for(const d of[1,2]){const a=nodeAt(x,y,d),b=nodeAt(x+DIRS[d][0],y+DIRS[d][1],(d+2)%4);if(a>=0&&b>=0)uni(p,a,b)}
    }else if(isTr(c.t)){
      const ch=c.r?[3,1]:[0,2],gt=c.r?[0,2]:[3,1];
      const nb=d=>nodeAt(x+DIRS[d][0],y+DIRS[d][1],(d+2)%4);
      trans.push({cell:c,c:ch.map(nb),g:gt.map(nb),p:c.t==='pmos'});
    }
  }
  for(let i=0;i<N;i++)find(p,i);
  staticP=p;nodeVal=new Uint8Array(N);nodeShort=new Uint8Array(N);dirty=false;
  document.getElementById('cnum').textContent=trans.length.toLocaleString('en-US');
}
function tick(){
  if(dirty)rebuild();
  const p=staticP.slice();
  for(const t of trans)if(t.cell.on&&t.c[0]>=0&&t.c[1]>=0)uni(p,t.c[0],t.c[1]);
  const f=new Uint8Array(N);
  for(const[k,c]of grid){
    let s=0;
    if(c.t==='vcc'||(c.t==='sw'&&c.on))s=1;else if(c.t==='gnd')s=2;else if(c.t==='pull')s=4;
    if(s)f[find(p,nodeIds.get(k))]|=s;
  }
  for(let i=0;i<N;i++){const r=f[find(p,i)];nodeShort[i]=(r&1)&&(r&2)?1:0;nodeVal[i]=(r&2)?0:(r&5?1:0)}
  const next=trans.map(t=>{const g=(t.g[0]>=0&&nodeVal[t.g[0]])||(t.g[1]>=0&&nodeVal[t.g[1]]);return t.p?!g:!!g});
  let changed=0;trans.forEach((t,i)=>{if(t.cell.on!==next[i]){t.cell.on=next[i];changed++}});
  return changed;
}

// ---------- vẽ ----------
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const cam={x:0,y:0,z:36};
let W=0,H=0,hover=null;
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);
  document.getElementById('counter').style.top=(document.getElementById('top').offsetHeight+10)+'px';if(autoFit&&typeof fit==='function')fit()}
let autoFit=true;
addEventListener('resize',resize);
const C={hi:'#ffd84a',lo:'#4a3f8c',short:'#ff3b3b',body:'#221d44',edge:'#6b5fc4'};
function wireCol(id){if(id<0)return C.lo;return nodeShort[id]?C.short:nodeVal[id]?C.hi:C.lo}
function line(x1,y1,x2,y2,col,w,glow){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';if(glow){ctx.shadowColor=col;ctx.shadowBlur=w*1.6}ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.shadowBlur=0}
function drawCell(x,y,c,ghost){
  const s=cam.z,px=x*s-cam.x,py=y*s-cam.y,cx=px+s/2,cy=py+s/2,lw=Math.max(2,s*.2);
  if(px>W||py>H||px<-s||py<-s)return;
  ctx.globalAlpha=ghost?.45:1;
  const id=ghost?-1:nodeIds.get(K(x,y));
  const has=d=>!ghost&&grid.has(K(x+DIRS[d][0],y+DIRS[d][1]));
  const stubs=(col,g)=>{let any=0;for(let d=0;d<4;d++)if(has(d)){any=1;line(cx,cy,cx+DIRS[d][0]*s/2,cy+DIRS[d][1]*s/2,col,lw,g)}return any};
  const t=c.t;
  if(t==='wire'){const col=wireCol(id),g=col!==C.lo;if(!stubs(col,g)){ctx.fillStyle=col;ctx.fillRect(cx-lw/2,cy-lw/2,lw,lw)}}
  else if(t==='bridge'){
    const ch=ghost?C.lo:wireCol(id),cv2=ghost?C.lo:wireCol(id+1);
    line(px,cy,px+s,cy,ch,lw,ch!==C.lo);
    const r=s*.22;ctx.strokeStyle=cv2;ctx.lineWidth=lw;if(cv2!==C.lo){ctx.shadowColor=cv2;ctx.shadowBlur=lw*1.6}
    ctx.beginPath();ctx.moveTo(cx,py);ctx.lineTo(cx,cy-r);ctx.arc(cx,cy,r,-Math.PI/2,Math.PI/2);ctx.lineTo(cx,py+s);ctx.stroke();ctx.shadowBlur=0;
  }
  else if(isTr(t)){
    ctx.save();ctx.translate(cx,cy);if(c.r)ctx.rotate(Math.PI/2);
    const on=!ghost&&c.on,col=on?C.hi:C.lo,r=s*.36;
    line(0,-s/2,0,s/2,col,lw,on);
    ctx.fillStyle=C.body;ctx.strokeStyle=on?C.hi:C.edge;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();
    line(-r*.25,-r*.6,-r*.25,r*.6,col,lw*.8,on);
    line(-s/2,0,-r*.55,0,C.edge,lw*.7);line(r*.55,0,s/2,0,C.edge,lw*.7);
    line(-r*.55,-r*.5,-r*.55,r*.5,C.edge,lw*.7);
    ctx.restore();
    ctx.fillStyle=on?'#000':'#cfc8ff';ctx.font=`${Math.round(s*.34)}px VT323,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    if(s>18)ctx.fillText(t==='nmos'?'N':'P',cx+s*.14,cy+1);
  }
  else if(t==='vcc'||t==='gnd'||t==='pull'){
    stubs(t==='gnd'?'#5e7bd6':C.lo,false);
    if(t==='vcc'){ctx.fillStyle='#ff4d6d';ctx.fillRect(px+s*.18,py+s*.18,s*.64,s*.64);line(cx-s*.18,cy,cx+s*.18,cy,'#fff',lw*.7);line(cx,cy-s*.18,cx,cy+s*.18,'#fff',lw*.7)}
    else if(t==='gnd'){ctx.fillStyle=C.body;ctx.fillRect(px+s*.15,py+s*.15,s*.7,s*.7);for(let i=0;i<3;i++)line(cx-s*(.28-i*.09),cy-s*.1+i*s*.14,cx+s*(.28-i*.09),cy-s*.1+i*s*.14,'#5e7bd6',lw*.6)}
    else{const v=ghost?0:nodeVal[id];ctx.fillStyle=C.body;ctx.fillRect(px+s*.2,py+s*.12,s*.6,s*.76);ctx.strokeStyle=v?C.hi:'#b39b3a';ctx.lineWidth=lw*.5;ctx.beginPath();
      for(let i=0;i<=6;i++){const yy=py+s*.2+i*s*.1,xx=cx+(i%2?s*.15:-s*.15)*(i&&i<6?1:0);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()}
  }
  else if(t==='sw'){
    stubs(c.on?C.hi:C.lo,c.on);
    ctx.fillStyle=c.on?'#3a3410':'#0f0d22';ctx.strokeStyle=c.on?C.hi:C.edge;ctx.lineWidth=2;ctx.fillRect(px+s*.12,py+s*.18,s*.76,s*.64);ctx.strokeRect(px+s*.12,py+s*.18,s*.76,s*.64);
    ctx.fillStyle=c.on?C.hi:'#9b93d0';ctx.font=`${Math.round(s*.55)}px VT323,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.on?'1':'0',cx,cy+1);
  }
  else if(t==='lamp'){
    const v=!ghost&&nodeVal[id];stubs(v?C.hi:C.lo,v);
    ctx.fillStyle=v?'#ff3b4f':'#3a1626';if(v){ctx.shadowColor='#ff3b4f';ctx.shadowBlur=s*.8}
    ctx.beginPath();ctx.arc(cx,cy,s*.34,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle=v?'#ffd0d6':'#5a2a3a';ctx.beginPath();ctx.arc(cx-s*.1,cy-s*.1,s*.09,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.fillStyle='#14112a';ctx.fillRect(0,0,W,H);
  const s=cam.z;
  if(s>=12){ctx.fillStyle='#2a2450';const x0=Math.floor(cam.x/s),y0=Math.floor(cam.y/s);
    for(let x=x0;x<=x0+W/s+1;x++)for(let y=y0;y<=y0+H/s+1;y++)ctx.fillRect(x*s-cam.x-1,y*s-cam.y-1,2,2)}
  for(const[k,c]of grid){const[x,y]=k.split(',').map(Number);drawCell(x,y,c,false)}
  if(hover&&tool!=='pan'){
    if(tool==='erase'){ctx.strokeStyle='#ff3b3b';ctx.lineWidth=2;ctx.strokeRect(hover[0]*s-cam.x+1,hover[1]*s-cam.y+1,s-2,s-2)}
    else if(!grid.has(K(...hover)))drawCell(hover[0],hover[1],{t:tool,r:rot,on:false},true);
    else{ctx.strokeStyle='#6b5fc4';ctx.lineWidth=1;ctx.strokeRect(hover[0]*s-cam.x+.5,hover[1]*s-cam.y+.5,s-1,s-1)}
  }
}

// ---------- chỉnh sửa ----------
const undoStack=[];
function snapshot(){undoStack.push(serialize());if(undoStack.length>100)undoStack.shift()}
function serialize(){return JSON.stringify({v:1,label,cells:[...grid].map(([k,c])=>[k,c.t,c.r|0,c.t==='sw'&&c.on?1:0])})}
function deserialize(s){const o=JSON.parse(s);grid.clear();for(const[k,t,r,on]of o.cells)grid.set(k,{t,r,on:!!on});label=o.label||'';setLabel();dirty=true}
function save(){try{localStorage.setItem('hopcat-logic',serialize())}catch(e){}}
function setLabel(){document.getElementById('cname').textContent=label}
function place(x,y){
  const k=K(x,y),c=grid.get(k);
  if(tool==='erase'){if(c){grid.delete(k);dirty=true}return}
  if(c&&c.t==='sw')return;
  if(c&&c.t===tool&&(c.r|0)===(isTr(tool)?rot:0))return;
  grid.set(k,{t:tool,r:isTr(tool)?rot:0,on:false});dirty=true;
}
function cellAt(e){return[Math.floor((e.clientX+cam.x)/cam.z),Math.floor((e.clientY+cam.y)/cam.z)]}
let drag=null,spaceDown=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  if(e.button===1||(e.button===0&&(spaceDown||tool==='pan'))){autoFit=false;drag={mode:'pan',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};return}
  const[x,y]=cellAt(e),c=grid.get(K(x,y));
  if(e.button===0&&c&&c.t==='sw'&&tool!=='erase'){snapshot();c.on=!c.on;save();return}
  snapshot();
  const saved=tool;if(e.button===2)tool='erase';
  place(x,y);drag={mode:'paint',last:[x,y],tool:tool,saved};tool=saved;
});
cv.addEventListener('pointermove',e=>{
  hover=cellAt(e);
  if(!drag)return;
  if(drag.mode==='pan'){cam.x=drag.cx-(e.clientX-drag.sx);cam.y=drag.cy-(e.clientY-drag.sy);return}
  const[x,y]=hover;let[lx,ly]=drag.last;const saved=tool;tool=drag.tool;
  while(lx!==x||ly!==y){if(lx!==x)lx+=Math.sign(x-lx);else ly+=Math.sign(y-ly);place(lx,ly)}
  tool=saved;drag.last=[x,y];
});
cv.addEventListener('pointerup',()=>{if(drag&&drag.mode==='paint')save();drag=null});
cv.addEventListener('pointerleave',()=>{hover=null});
cv.addEventListener('wheel',e=>{e.preventDefault();autoFit=false;const f=Math.exp(-e.deltaY*.0015),nz=Math.min(120,Math.max(4,cam.z*f));
  const wx=(e.clientX+cam.x)/cam.z,wy=(e.clientY+cam.y)/cam.z;cam.z=nz;cam.x=wx*nz-e.clientX;cam.y=wy*nz-e.clientY},{passive:false});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){spaceDown=true;e.preventDefault()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}
  else if(e.key==='r'||e.key==='R')setRot(rot^1);
  else if(e.key==='p'||e.key==='P')togglePlay();
  else if(e.key==='.')stepOnce();
  else{const t=TOOLS.find(t=>t[2]&&t[2]===e.key);if(t)setTool(t[0])}
});
addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});
function undo(){const s=undoStack.pop();if(s){deserialize(s);save()}}

// ---------- giao diện ----------
const toolsEl=document.getElementById('tools');
for(const[id,name,key]of TOOLS){const b=document.createElement('button');b.textContent=(key?key+' ':'')+name;b.title=TIPS[id];b.dataset.t=id;b.onclick=()=>setTool(id);toolsEl.appendChild(b);toolsEl.append(' ')}
function setTool(t){tool=t;toolsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setRot(r){rot=r;document.getElementById('rot').textContent=r?'⟳ Ngang':'⟳ Dọc'}
let running=true,speed=12;
function togglePlay(){running=!running;document.getElementById('play').textContent=running?'⏸ Dừng':'▶ Chạy'}
function stepOnce(){if(running)togglePlay();tick()}
document.getElementById('play').onclick=togglePlay;
document.getElementById('step').onclick=stepOnce;
document.getElementById('rot').onclick=()=>setRot(rot^1);
const sp=document.getElementById('speed');sp.oninput=()=>{speed=+sp.value;document.getElementById('spv').textContent=speed>60?'Tức thì':speed+'/s'};
document.getElementById('undo').onclick=undo;
document.getElementById('clear').onclick=()=>{snapshot();grid.clear();label='';setLabel();dirty=true;save()};
document.getElementById('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([serialize()],{type:'application/json'}));a.download='mach-logic.json';a.click()};
const fileEl=document.getElementById('file');
document.getElementById('imp').onclick=()=>fileEl.click();
fileEl.onchange=async()=>{const f=fileEl.files[0];if(!f)return;try{snapshot();deserialize(await f.text());save();fit()}catch(e){alert('File không hợp lệ')}fileEl.value=''};

// ---------- mạch mẫu ----------
const LEG={'#':'wire','+':'vcc','G':'gnd','r':'pull','S':'sw','L':'lamp','X':'bridge','N':['nmos',0],'n':['nmos',1],'P':['pmos',0],'p':['pmos',1]};
function chain(n,ring){
  const u=['..r.L','..###','##N.#','..G..'];const rows=[[],[],[],[]];
  for(let i=0;i<n;i++)for(let r=0;r<4;r++){let s=u[r];if(i===0&&r===2)s=(ring?'#':'S')+s.slice(1);if(ring&&i===n-1&&r===3)s=s.slice(0,4)+'#';rows[r].push(s)}
  const out=rows.map(r=>r.join(''));
  if(ring){const w=n*5;out[3]='#'+out[3].slice(1);out.push('#'+'.'.repeat(w-2)+'#');out.push('#'.repeat(w))}
  return out;
}
const EX={
  'Cổng NOT':['..r..','..##L','S#N..','..G..'],
  'Cổng NAND':['..r....','..####L','..#....','S#N....','..#....','S#N....','..#....','..G....'],
  'Cổng NOR':['..r.....','..#####L','..#...#.','S#N.S#N.','..#...#.','..#####.','....G...'],
  'NOT kiểu CMOS':['...+...','.##P...','.#.###L','S##N...','...G...'],
  'Chuỗi domino (8 NOT)':chain(8,false),
  'Bộ dao động vòng (5 NOT)':chain(5,true),
};
const exEl=document.getElementById('ex');
for(const n in EX){const o=document.createElement('option');o.value=n;o.textContent=n;exEl.appendChild(o)}
exEl.onchange=()=>{if(exEl.value){snapshot();loadEx(exEl.value);save()}exEl.value=''};
function loadEx(name){
  grid.clear();
  EX[name].forEach((row,y)=>[...row].forEach((ch,x)=>{const l=LEG[ch];if(!l)return;const[t,r]=Array.isArray(l)?l:[l,0];grid.set(K(x,y),{t,r,on:false})}));
  label=name.toUpperCase();setLabel();dirty=true;fit();
}
function fit(){
  autoFit=true;
  if(!grid.size){cam.x=-W/2;cam.y=-H/2;return}
  let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const k of grid.keys()){const[x,y]=k.split(',').map(Number);a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x+1);d=Math.max(d,y+1)}
  const top=document.getElementById('top').offsetHeight+130,avH=H-top-50;
  cam.z=Math.max(8,Math.min(56,(W-60)/(c-a),avH/(d-b)));
  cam.x=(a+c)/2*cam.z-W/2;cam.y=(b+d)/2*cam.z-(top+avH/2);
}

// ---------- vòng lặp ----------
let acc=0,lastT=performance.now();
function frame(t){
  const dt=Math.min(.25,(t-lastT)/1000);lastT=t;
  if(dirty)rebuild();
  if(running){
    if(speed>60){for(let i=0;i<500;i++)if(!tick())break}
    else{acc+=dt*speed;let n=0;while(acc>=1&&n<60){tick();acc-=1;n++}}
  }
  draw();requestAnimationFrame(frame);
}
resize();setTool('wire');setRot(0);
let loaded=false;try{const s=localStorage.getItem('hopcat-logic');if(s){deserialize(s);loaded=grid.size>0}}catch(e){}
if(loaded)fit();else loadEx('Cổng NAND');
window.__sim={grid,tick,K,loadEx,nodeVal:()=>nodeVal,nodeAt,rebuild:()=>rebuild()};
requestAnimationFrame(frame);
</script>
